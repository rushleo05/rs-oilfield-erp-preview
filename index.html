oller','Approved','Active']]};
let state={module:'Dashboard',feature:'Executive Dashboard',location:'All Locations',page:1,rowsPerPage:5,view:'list',selected:0};
function renderNav(){nav.innerHTML=Object.keys(modules).map(m=>`<button class="navbtn ${state.module===m?'active':''}" onclick="openModule('${m.replaceAll("'","\\'")}')"><span class="ico">${icons[m]}</span><span class="label">${m}</span><span class="chev">›</span></button>`).join('')}
function openModule(m){state.module=m;state.feature=modules[m][0];state.page=1;state.view='list';render()}
function chooseFeature(f){state.feature=f;state.page=1;state.view='list';render()}
function nextFeature(n){let a=modules[state.module],i=a.indexOf(state.feature);i=Math.max(0,Math.min(a.length-1,i+n));state.feature=a[i];state.view='list';state.page=1;render()}
function setLocation(v){state.location=v;document.getElementById('topLocation').value=v;render()}
function dashboard(){return `<div class="pagehead"><div><h1>Operations Dashboard</h1><div class="sub">Real-time overview across Houston, Midland, St. Clairsville and Odessa</div></div><div class="actions"><button class="btn">Today</button><button class="btn">This Month</button><button class="btn primary" onclick="window.print()">Print Dashboard</button></div></div><div class="grid kpis">${[['💲','Sales This Month','$436,286','8.4% vs last month','cgreen'],['📦','Inventory Value','$2.48M','49,820 total units','cblue'],['🛒','Open Sales Orders','27','9 ready to ship','corange'],['💹','Gross Profit','$128,500','29.5% margin','cpurple'],['⚠','Low Stock Items','18','5 below minimum','cred']].map(x=>`<div class="kpi"><div class="circle ${x[4]}">${x[0]}</div><div><div class="label">${x[1]}</div><div class="value editable" contenteditable="true">${x[2]}</div><small>${x[3]}</small></div></div>`).join('')}</div><div class="grid sectionrow"><div class="card panel"><h3>Recent Sales Orders</h3><div class="tablewrap"><table><tr><th>SO No</th><th>Customer</th><th>Amount</th><th>Status</th><th>Action</th></tr>${baseRows.Sales.map((r,i)=>`<tr><td>${r[0]}</td><td>${r[2]}</td><td>${r[6]}</td><td><span class="badge">${r[7]}</span></td><td><a class="link" onclick="openModule('Sales');state.selected=${i};state.view='details';render()">View</a></td></tr>`).join('')}</table></div></div><div class="card panel"><h3>Action Required</h3>${[['Sales Orders waiting for stock','7'],['Purchase Orders late','3'],['Items waiting for QC','12'],['Orders ready to ship','9'],['Customer invoices past due','6']].map(x=>`<div class="actionline"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></div><div class="grid dashbottom"><div class="card panel"><h3>Sales vs Purchases</h3><div class="bars">${['Mar','Apr','May','Jun','Jul','Aug'].map((m,i)=>`<div class="bargrp"><div class="barpair"><div class="bar salesbar" style="height:${55+i*12}px"></div><div class="bar buybar" style="height:${35+i*9}px"></div></div>${m}</div>`).join('')}</div></div><div class="card panel"><h3>Inventory by Location</h3>${[['Houston','40%'],['Midland','27%'],['St. Clairsville','15%'],['Odessa','18%']].map(x=>`<div class="actionline"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="card panel"><h3>Recent Activity</h3>${[['GRN2600184 received','QC Hold'],['INV2601344 posted','Posted'],['PO FGH2600330 approved','Approved'],['WO2600164 material issued','In Process']].map(x=>`<div class="actionline"><span>${x[0]}</span><span class="badge">${x[1]}</span></div>`).join('')}</div></div>`}
function rowsFor(m){let b=baseRows[m]||baseRows.Reports;let out=[];for(let i=0;i<15;i++){let r=[...b[i%b.length]];r[0]=i<2?r[0]:r[0]+'-'+String(i+1).padStart(2,'0');out.push(r)}return out}
function modulePage(){let cfg=configs[state.module]||configs.Reports,rows=rowsFor(state.module),totalPages=Math.ceil(rows.length/state.rowsPerPage);state.page=Math.min(state.page,totalPages);let start=(state.page-1)*state.rowsPerPage,shown=rows.slice(start,start+state.rowsPerPage);return `<div class="pagehead"><div><h1>${state.module}</h1><div class="sub">${state.feature} • ${state.location}</div></div><div class="actions"><button class="btn" onclick="nextFeature(-1)">← Previous</button><button class="btn" onclick="nextFeature(1)">Next →</button><button class="btn primary" onclick="openEdit(-1)">+ New</button></div></div><div class="worklayout"><div class="card modulemenu"><h3>${state.module} Menu</h3>${modules[state.module].map(f=>`<button class="featurebtn ${f===state.feature?'active':''}" onclick="chooseFeature('${f.replaceAll("'","\\'")}')">${f}</button>`).join('')}</div><div class="workspace"><div class="grid modulekpis">${cfg.k.map((k,i)=>`<div class="card mkpi"><small>${k}</small><b class="editable" contenteditable="true">${cfg.v[i]}</b></div>`).join('')}</div><div class="card"><div class="toolbar"><div class="field grow"><label>Search ${state.feature}</label><input id="searchBox" placeholder="Search document, customer, supplier, item..." oninput="filterRows()"></div><div class="field"><label>Location</label><select onchange="setLocation(this.value)"><option>${state.location}</option><option>All Locations</option><option>Houston</option><option>Midland</option><option>St. Clairsville</option><option>Odessa</option></select></div><button class="btn" onclick="exportCSV()">Export CSV</button><button class="btn" onclick="window.print()">Print</button></div><div class="tabs"><button class="tab ${state.view==='list'?'active':''}" onclick="state.view='list';render()">List</button><button class="tab ${state.view==='details'?'active':''}" onclick="state.view='details';render()">Details</button><button class="tab ${state.view==='history'?'active':''}" onclick="state.view='history';render()">History</button></div><div id="viewArea">${renderView(shown,cfg,rows)}</div></div></div></div>`}
function renderView(shown,cfg,all){if(state.view==='details')return detailsView(all);if(state.view==='history')return historyView();return `<div class="tablewrap"><table id="dataTable"><thead><tr>${cfg.cols.map(c=>`<th>${c}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${shown.map((r,idx)=>`<tr>${r.map((c,j)=>`<td class="editable" contenteditable="true">${j===r.length-1?`<span class="badge">${c}</span>`:c}</td>`).join('')}<td><a class="link" onclick="state.selected=${(state.page-1)*state.rowsPerPage+idx};state.view='details';render()">Details</a> &nbsp; <a class="link" onclick="state.selected=${(state.page-1)*state.rowsPerPage+idx};state.view='history';render()">History</a> &nbsp; <a class="link" onclick="openEdit(${(state.page-1)*state.rowsPerPage+idx})">Edit</a></td></tr>`).join('')}</tbody></table></div><div class="pagination"><span>Showing ${(state.page-1)*state.rowsPerPage+1}-${Math.min(state.page*state.rowsPerPage,all.length)} of ${all.length}</span><div class="pager"><button class="btn" onclick="goPage(-1)" ${state.page===1?'disabled':''}>← Previous</button><b>Page ${state.page} of ${Math.ceil(all.length/state.rowsPerPage)}</b><button class="btn" onclick="goPage(1)" ${state.page>=Math.ceil(all.length/state.rowsPerPage)?'disabled':''}>Next →</button></div></div>`}
function detailsView(all){let r=all[state.selected]||all[0],cfg=configs[state.module]||configs.Reports;return `<div class="detailgrid">${cfg.cols.map((c,i)=>`<div class="detailbox"><small>${c}</small><div class="editable" contenteditable="true">${r[i]||'—'}</div></div>`).join('')}</div><div style="padding:0 14px 14px"><button class="btn primary" onclick="openEdit(${state.selected})">Edit Record</button> <button class="btn" onclick="state.view='history';render()">View History</button> <button class="btn" onclick="state.view='list';render()">Back to List</button></div>`}
function historyView(){let id=(rowsFor(state.module)[state.selected]||['Record'])[0];return `<div class="history"><div class="historyitem"><b>${id}</b> created in ${state.module}.<br><span class="sub">08/19/2026 09:18 AM • Admin</span></div><div class="historyitem"><b>Status updated</b> for ${state.feature}.<br><span class="sub">08/19/2026 10:04 AM • Operations User</span></div><div class="historyitem"><b>Quantity / value reviewed</b> and saved.<br><span class="sub">08/19/2026 11:26 AM • Supervisor</span></div><div class="historyitem"><b>Latest activity</b> recorded for ${state.location}.<br><span class="sub">08/19/2026 01:42 PM • System</span></div></div><div style="padding:0 14px 14px"><button class="btn" onclick="state.view='details';render()">Details</button> <button class="btn" onclick="state.view='list';render()">Back to List</button></div>`}
function goPage(d){let max=Math.ceil(rowsFor(state.module).length/state.rowsPerPage);state.page=Math.max(1,Math.min(max,state.page+d));render()}
function openEdit(i){let rows=rowsFor(state.module),r=i>=0?rows[i]:new Array((configs[state.module]||configs.Reports).cols.length).fill('');state.selected=Math.max(i,0);modalTitle.textContent=(i>=0?'Edit ':'New ')+state.feature;modalBody.innerHTML=`<div class="formgrid">${(configs[state.module]||configs.Reports).cols.map((c,j)=>`<div class="field"><label>${c}</label><input value="${String(r[j]||'').replaceAll('"','&quot;')}"></div>`).join('')}</div>`;modalback.classList.add('show')}
function closeModal(){modalback.classList.remove('show')}function saveRecord(){closeModal();toastMsg('Changes saved in this preview.')}
function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
function filterRows(){let q=(document.getElementById('searchBox')?.value||'').toLowerCase();document.querySelectorAll('#dataTable tbody tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none')}
function exportCSV(){let cfg=configs[state.module]||configs.Reports,rows=rowsFor(state.module);let csv=[cfg.cols.join(','),...rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=state.module.replaceAll(' ','_')+'_'+state.feature.replaceAll(' ','_')+'.csv';a.click();URL.revokeObjectURL(a.href)}
function globalSearchKey(e){if(e.key==='Enter'){let q=e.target.value.toLowerCase();for(let m of Object.keys(modules)){let f=modules[m].find(x=>x.toLowerCase().includes(q));if(f){state.module=m;state.feature=f;state.view='list';render();return}}toastMsg('No matching page found.')}}
function render(){renderNav();document.getElementById('topLocation').value=state.location;main.innerHTML=state.module==='Dashboard'?dashboard():modulePage()}render();
</script></body></html>
