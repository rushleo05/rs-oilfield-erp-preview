<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R&S Oilfield ERP Preview</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#172536}.top{background:#0f2e4d;color:white;padding:18px 24px;font-size:22px;font-weight:700}.wrap{display:flex;min-height:calc(100vh - 62px)}nav{width:240px;background:#fff;border-right:1px solid #dbe3ec;padding:14px}nav button{display:block;width:100%;padding:11px 12px;margin:4px 0;border:0;border-radius:8px;background:transparent;text-align:left;cursor:pointer}nav button:hover,nav button.active{background:#eaf2ff;color:#1f6feb}.main{flex:1;padding:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card,.panel{background:white;border:1px solid #dbe3ec;border-radius:12px;padding:18px;margin-bottom:16px}.num{font-size:28px;font-weight:700;margin-top:8px}.tabs span{display:inline-block;background:#eef3f8;padding:8px 10px;border-radius:7px;margin:4px}.muted{color:#6b7a90}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e5eaf0;text-align:left}.badge{background:#e8f5ec;color:#237a3b;padding:4px 8px;border-radius:20px;font-size:12px}</style></head><body><div class="top">R&S Oilfield ERP — Clickable Review Prototype</div><div class="wrap"><nav id="nav"></nav><main class="main" id="main"></main></div><script>const sections={Dashboard:['Sales Today','Open Sales Orders','Open Purchase Orders','Inventory Value','Low Stock Items','Awaiting QC','Ready to Ship','Accounts Receivable','Accounts Payable'],CRM:['Customers','Contacts','Follow Ups','Activities','Sales Opportunities','Customer Documents'],Sales:['Quotation','Sales Order','Sales Order Amendment','Hold / Release','Backorders','Picking & Packing','Delivery / Shipment','Sales Invoice','Sales Return / Credit Note','Inter-Location Sales','Customer Sales Order Query','Missed Sales','Commission','Shipping Charges'],Purchasing:['Purchase Requisition','Purchase Order','PO Amendment','Open Purchase Orders','GRN / Material Receipt','Supplier Pricing','Purchase Invoice','Jobwork Purchase Order','International Purchase / Tariff','Supplier History'],Inventory:['Item Master','Item Groups','Stock by Location','Available / Committed Stock','Min-Max Levels','Reorder Status','Incoming Stock','Inventory Valuation','Lot / Heat Tracking','Stock Adjustment'],Warehouse:['Receiving','Put Away','Bin Allocation','Picking','Packing','Dispatch / Delivery','Warehouse Transfer','Inter-Store Transfer','Stock Lookup','Delivery Auto Stock Deduction'],Quality:['Incoming Inspection','Pending Inspection','Accepted Material','Rejected Material','Inspection Reports','Certificates / Documents'],Planning:['Material Planning','Min-Max Planning','Production Planning','Purchase Requirements','Sales Demand Planning'],Production:['Work Orders','Bill of Materials','Material Issue','Production Entry','Daily Production','Jobwork / Subcontracting','Outward Challan','Subcontract Receipt'],Accounting:['General Ledger','Journal Voucher','Opening Balances','Accounts Receivable','Accounts Payable','Customer Payments','Supplier Payments','Cash & Bank','Bank Reconciliation','Sales Credit / Debit Notes','Purchase Credit / Debit Notes','AR Aging','AP Aging','Outstanding','Trial Balance','Income Statement','Balance Sheet','Sales Tax','Sales Register','Purchase Register'],Reports:['Item Wise Sales','Customer Wise Sales','Salesperson Sales','Item Wise PO','Item Wise GRN','Supplier Wise GRN','Group Wise Purchase Summary','Party Wise Purchase','Purchase Order Query','Jobwork PO Query','Customer Invoice Reports','Outstanding Reports','Paid Invoice List','PO History','Inventory / Stock Reports','Tax & Financial Reports'],Master_Data:['Customers','Suppliers','Items','Item Groups','Locations','Warehouses','Bins','UOM','Currencies','Countries','Tariff / Duty Rules','Payment Terms','Salespersons','Account Categories','General Ledger Accounts'],Settings:['Users & Roles','Permissions','Locations','Document Numbering','Tax Settings','Transaction Lock','Account Settings','Notifications','Audit Log']};let active='Dashboard';function renderNav(){nav.innerHTML=Object.keys(sections).map(k=>`<button class="${active===k?'active':''}" onclick="active='${k}';render()">${k.replace('_',' ')}</button>`).join('')}function render(){renderNav();if(active==='Dashboard'){main.innerHTML=`<h1>Operations Dashboard</h1><p class="muted">All Locations: Houston • Midland • St. Clairsville • Odessa</p><div class="cards">${sections.Dashboard.map((x,i)=>`<div class="card"><div>${x}</div><div class="num">${[ '$124,850','27','14','$2.48M','18','12','9','$486K','$311K'][i]}</div></div>`).join('')}</div><div class="panel"><h2>Action Required</h2><div class="tabs"><span>7 Sales Orders Waiting for Stock</span><span>3 Purchase Orders Late</span><span>12 Items Waiting for QC</span><span>4 Orders Ready to Ship</span><span>6 Customer Invoices Past Due</span></div></div>`}else if(active==='Inventory'){main.innerHTML=`<h1>Inventory</h1><div class="panel"><h2>Item Master / Stock Lookup</h2><p><b>Item:</b> Adapter Spool — 7-1/16 5M × 3-1/8 5M</p><p class="muted">API equipment • EA • Preferred supplier tracked • Image placeholder available</p><table><tr><th>Location</th><th>On Hand</th><th>Committed</th><th>Available</th><th>On PO</th><th>QC</th><th>Status</th></tr><tr><td>Houston</td><td>24</td><td>8</td><td>16</td><td>10</td><td>2</td><td><span class="badge">OK</span></td></tr><tr><td>Midland</td><td>11</td><td>4</td><td>7</td><td>6</td><td>0</td><td><span class="badge">OK</span></td></tr><tr><td>St. Clairsville</td><td>6</td><td>3</td><td>3</td><td>0</td><td>1</td><td>Low</td></tr><tr><td>Odessa</td><td>8</td><td>2</td><td>6</td><td>4</td><td>0</td><td><span class="badge">OK</span></td></tr></table></div><div class="panel"><h2>Inventory Functions</h2><div class="tabs">${sections.Inventory.map(x=>`<span>${x}</span>`).join('')}</div></div>`}else{main.innerHTML=`<h1>${active.replace('_',' ')}</h1><p class="muted">Review checklist based on the current ERP screenshots. These functions will be organized into cleaner connected workflows.</p><div class="panel"><h2>Included Functions</h2><div class="tabs">${sections[active].map(x=>`<span>${x}</span>`).join('')}</div></div><div class="panel"><h2>Prototype Status</h2><p>Click each department on the left to verify that the feature has a home in the redesigned ERP. Detailed transaction screens will be added after you approve the structure.</p></div>`}}render();</script></body></html>
