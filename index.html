<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>R&S Oilfield ERP Preview</title>
<style>
:root{--nav:#0d2b45;--nav2:#123a5d;--blue:#2f6feb;--bg:#f3f6fa;--card:#fff;--line:#dce4ec;--text:#172536;--muted:#6d7c8d;--green:#1f9d62;--amber:#d98b18;--red:#d84b4b;--purple:#7a5ce6}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;min-height:100vh}.sidebar{width:255px;background:linear-gradient(180deg,var(--nav),#092136);color:#fff;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{padding:22px 18px;border-bottom:1px solid rgba(255,255,255,.08)}.brand h1{font-size:19px;margin:0}.brand small{display:block;color:#a9bfd3;margin-top:5px}.nav{padding:12px}.nav button{width:100%;border:0;background:transparent;color:#d8e6f2;padding:11px 12px;border-radius:9px;text-align:left;margin:3px 0;font-size:14px;cursor:pointer}.nav button:hover,.nav button.active{background:#1b4d75;color:#fff}.content{margin-left:255px;width:calc(100% - 255px)}
.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:4}.search{width:min(520px,52vw);background:#f6f8fb;border:1px solid var(--line);border-radius:10px;padding:10px 13px;color:#788697}.topright{display:flex;align-items:center;gap:10px}.pill{background:#eef4ff;color:#2f6feb;border-radius:20px;padding:8px 11px;font-size:13px}.avatar{width:36px;height:36px;border-radius:50%;background:#14395a;color:#fff;display:grid;place-items:center;font-weight:700}
.main{padding:24px}.headerrow{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px}.headerrow h2{font-size:26px;margin:0 0 4px}.muted{color:var(--muted)}.location{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.grid{display:grid;gap:15px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 12px rgba(15,34,54,.04)}.kpi{padding:17px;position:relative;overflow:hidden}.kpi .label{font-size:13px;color:var(--muted)}.kpi .value{font-size:27px;font-weight:750;margin:7px 0}.kpi .trend{font-size:12px;color:var(--green)}.kpi .icon{position:absolute;right:14px;top:14px;width:37px;height:37px;border-radius:10px;background:#eef4ff;display:grid;place-items:center;color:var(--blue);font-weight:700}
.two{grid-template-columns:1.35fr .8fr;margin-top:15px}.panel{padding:18px}.panel h3{margin:0 0 14px;font-size:17px}.bars{height:235px;display:flex;align-items:flex-end;gap:18px;padding:14px 4px 4px}.barwrap{flex:1;text-align:center;color:#788697;font-size:12px}.bar{width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#5f8ff2,#2f6feb);min-height:18px;margin-bottom:8px}.donut{width:150px;height:150px;border-radius:50%;margin:14px auto;background:conic-gradient(#2f6feb 0 40%,#20a36a 40% 67%,#e49a24 67% 82%,#825ee6 82% 100%);position:relative}.donut:after{content:"$2.48M";position:absolute;inset:25px;background:#fff;border-radius:50%;display:grid;place-items:center;font-weight:750}.legend div{display:flex;justify-content:space-between;margin:8px 0;font-size:13px}
.actiongrid{grid-template-columns:1fr 1fr;margin-top:15px}.alerts{display:grid;gap:9px}.alert{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:11px 12px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px}.red{background:var(--red)}.amber{background:var(--amber)}.green{background:var(--green)}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 10px;border-bottom:1px solid #e8edf2;text-align:left;white-space:nowrap}th{color:#718092;font-size:12px;font-weight:650;background:#fbfcfe}.badge{display:inline-block;padding:5px 8px;border-radius:20px;font-size:11px;background:#eaf7f0;color:#24804a}.badge.warn{background:#fff4df;color:#a76a10}.badge.redb{background:#fdecec;color:#b13d3d}
.modulehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:15px}.tab{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13px;cursor:pointer}.tab:hover{border-color:#8bb0ff;background:#f6f9ff}.modulegrid{grid-template-columns:repeat(3,minmax(0,1fr))}.feature{padding:16px;cursor:pointer}.feature:hover{border-color:#9fb9e7;transform:translateY(-1px)}.feature b{display:block;margin-bottom:6px}.feature small{color:var(--muted)}
.itemhero{display:grid;grid-template-columns:180px 1fr;gap:18px}.equip{height:150px;border-radius:12px;background:linear-gradient(145deg,#d5dbe1,#f6f8fa);display:grid;place-items:center;font-weight:800;color:#566574;border:1px solid var(--line)}.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.mini{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fbfcfe}.mini b{display:block;font-size:18px;margin-top:3px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.two,.actiongrid,.modulegrid{grid-template-columns:1fr}.itemhero{grid-template-columns:1fr}.sidebar{width:215px}.content{margin-left:215px;width:calc(100% - 215px)}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><h1>R&S OILFIELD, INC.</h1><small>ERP Management System</small></div><div id="nav" class="nav"></div></aside>
<section class="content"><div class="topbar"><div class="search">🔎 Search item, customer, SO, PO, invoice, lot/heat...</div><div class="topright"><span class="pill">All Locations</span><span>🔔</span><div class="avatar">RS</div></div></div><main id="main" class="main"></main></section>
</div>
<script>
const sections={Dashboard:['Executive Dashboard'],CRM:['Customers','Contacts','RFQ / Enquiry','Quotation Follow Up','Activities','Sales Opportunities','Customer Documents'],Sales:['New Quotation','Sales Orders','Sales Order Amendment','Hold / Release','Backorders','Pick List','Packing','Shipment / Delivery','POD','Generate Invoice','Sales Invoices','Sales Return / Credit Note','Completed Orders','Inter-Location Sales / Transfer','Customer Sales Order Query','Missed Sales','Commission','Shipping Charges'],Purchasing:['Purchase Requisition','New Purchase Order','Purchase Orders','PO Approval','PO Amendment','Open Purchase Orders','GRN / Material Receipt','Supplier Pricing','Purchase Invoice','Jobwork Purchase Order','International Purchase / Tariff','Supplier History','Purchase Reports'],Inventory:['Item Master','Item Groups','Stock by Location','Available / Committed Stock','Min-Max Levels','Reorder Status','Incoming Stock','Inventory Valuation','Lot / Heat Tracking','Stock Adjustment','Finished Goods Stock','Subcontractor Stock'],Warehouse:['Receiving / GRN','Put Away','Bin Allocation','Picking','Packing','Dispatch / Delivery','Warehouse Transfer','Inter-Store Transfer','Stock Lookup','Inter-Store Invoice Receipt','Stock Receipt','Delivery Auto Stock Deduction'],Quality:['Incoming Inspection','Pending Inspection','Accepted Material','Rejected Material','Incoming Test Certificate','Inspection Reports','Certificates / Documents'],Planning:['Material Planning','Min-Max Planning','Production Planning','Purchase Requirements','Sales Demand Planning'],Production:['Work Orders','Make to Stock','Bill of Materials','Material Issue','Assembly Production Entry','Daily Production','Jobwork / Subcontracting','Outward Challan','Subcontract Receipt','Production Reports'],Accounting:['Account Category / GL Setup','General Ledger','Journal Voucher','Opening Balances','Accounts Receivable','Accounts Payable','Sales Invoice','Purchase Invoice','Customer Payments','Supplier Payments','Cash & Bank','Bank Reconciliation','Sales Credit / Debit Notes','Purchase Credit / Debit Notes','AR Aging','AP Aging','Outstanding','Paid Invoice List','Trial Balance','Income Statement','Balance Sheet','Sales Tax','Sales Register','Purchase Register','PO History','Transaction Lock'],Reports:['Item Wise Sales','Customer Wise Sales','Salesperson Sales','Item Wise SO','Item Wise Invoice','Item Wise PO','Item Wise GRN','Supplier Wise GRN','Group Wise Purchase Summary','Party Wise Purchase','Purchase Order Query','Jobwork PO Query','Customer Invoice Reports','Outstanding Reports','Paid Invoice List','PO History','Inventory / Stock Reports','Tax & Financial Reports','Custom Query Designer','Excel / PDF Export'],Master_Data:['Item Master','Customer / Supplier Master','Manufacturers','Agents','BOM & Routing','Work Centers','Locations','Employees','Operators','Supervisors','Shifts','Approvals / Authorization','Warehouses','Bins','UOM','Currencies','Countries','Tariff / Duty Rules','Payment Terms','Salespersons'],Settings:['Users & Roles','Permissions','Locations','Document Numbering','Tax Settings','Transaction Lock','Account Settings','Notifications','Audit Log']};
let active='Dashboard';
function renderNav(){nav.innerHTML=Object.keys(sections).map(k=>`<button class="${active===k?'active':''}" onclick="active='${k}';render()">${icon(k)} ${k.replace('_',' ')}</button>`).join('')}
function icon(k){return {Dashboard:'▦',CRM:'◉',Sales:'↗',Purchasing:'🛒',Inventory:'▣',Warehouse:'▤',Quality:'✓',Planning:'◫',Production:'⚙',Accounting:'$',Reports:'▥',Master_Data:'◇',Settings:'⚙'}[k]||'•'}
function dashboard(){return `<div class="headerrow"><div><h2>Operations Dashboard</h2><div class="muted">Real-time overview across Houston, Midland, St. Clairsville and Odessa</div></div><select class="location"><option>All Locations</option><option>Houston</option><option>Midland</option><option>St. Clairsville</option><option>Odessa</option></select></div>
<div class="grid kpis"><div class="card kpi"><span class="icon">$</span><div class="label">Sales This Month</div><div class="value">$436,286</div><div class="trend">▲ 8.4% vs last month</div></div><div class="card kpi"><span class="icon">▣</span><div class="label">Inventory Value</div><div class="value">$2.48M</div><div class="trend">49,820 total units</div></div><div class="card kpi"><span class="icon">↗</span><div class="label">Open Sales Orders</div><div class="value">27</div><div class="trend">9 ready to ship</div></div><div class="card kpi"><span class="icon">$</span><div class="label">Gross Profit</div><div class="value">$128,500</div><div class="trend">29.5% margin</div></div><div class="card kpi"><span class="icon">AR</span><div class="label">Accounts Receivable</div><div class="value">$486K</div><div class="trend">6 invoices overdue</div></div><div class="card kpi"><span class="icon">AP</span><div class="label">Accounts Payable</div><div class="value">$311K</div><div class="trend">4 due this week</div></div><div class="card kpi"><span class="icon">QC</span><div class="label">Awaiting QC</div><div class="value">12</div><div class="trend">3 high priority</div></div><div class="card kpi"><span class="icon">!</span><div class="label">Low Stock Items</div><div class="value">18</div><div class="trend">5 below minimum</div></div></div>
<div class="grid two"><div class="card panel"><h3>Sales & Purchasing Trend</h3><div class="bars">${[46,68,57,82,72,93].map((h,i)=>`<div class="barwrap"><div class="bar" style="height:${h*1.8}px"></div>${['Mar','Apr','May','Jun','Jul','Aug'][i]}</div>`).join('')}</div></div><div class="card panel"><h3>Inventory by Location</h3><div class="donut"></div><div class="legend"><div><span>Houston</span><b>40%</b></div><div><span>Midland</span><b>27%</b></div><div><span>St. Clairsville</span><b>15%</b></div><div><span>Odessa</span><b>18%</b></div></div></div></div>
<div class="grid actiongrid"><div class="card panel"><h3>Action Required</h3><div class="alerts"><div class="alert"><span><i class="dot red"></i>Sales Orders waiting for stock</span><b>7</b></div><div class="alert"><span><i class="dot amber"></i>Purchase Orders late</span><b>3</b></div><div class="alert"><span><i class="dot amber"></i>Items waiting for QC</span><b>12</b></div><div class="alert"><span><i class="dot green"></i>Orders ready to ship</span><b>9</b></div><div class="alert"><span><i class="dot red"></i>Customer invoices past due</span><b>6</b></div></div></div><div class="card panel"><h3>Recent Activity</h3><div class="tablewrap"><table><tr><th>Time</th><th>Transaction</th><th>Status</th></tr><tr><td>10:42</td><td>SO2600972 — Bell Supply</td><td><span class="badge">Allocated</span></td></tr><tr><td>10:15</td><td>GRN2600184 — Mars Forge</td><td><span class="badge warn">QC Hold</span></td></tr><tr><td>09:48</td><td>INV2601344 — Dynamic Pressure</td><td><span class="badge">Posted</span></td></tr><tr><td>09:20</td><td>PO2600330 — International Vendor</td><td><span class="badge warn">Approval</span></td></tr></table></div></div></div>`}
function inventory(){return `<div class="headerrow"><div><h2>Inventory Workspace</h2><div class="muted">Search one item and see stock, pricing, purchasing, QC and movement in one workspace</div></div><button class="tab">+ New Item</button></div><div class="card panel itemhero"><div class="equip">EQUIPMENT IMAGE</div><div><h3 style="margin-top:0">Adapter Spool — 7-1/16\" 5M × 3-1/8\" 5M</h3><div class="muted">Item RDSA29160521165 • API equipment • EA • Preferred supplier: Mars Forge</div><div class="statrow"><div class="mini">Landed Cost<b>$924.50</b></div><div class="mini">Last Sold<b>$1,350</b></div><div class="mini">Available<b>32</b></div><div class="mini">Incoming PO<b>20</b></div></div></div></div><div class="card panel"><h3>Stock by Location</h3><div class="tablewrap"><table><tr><th>Location</th><th>On Hand</th><th>Committed</th><th>Available</th><th>On PO</th><th>QC</th><th>Bin</th><th>Status</th></tr><tr><td>Houston</td><td>24</td><td>8</td><td>16</td><td>10</td><td>2</td><td>DS-04</td><td><span class="badge">OK</span></td></tr><tr><td>Midland</td><td>11</td><td>4</td><td>7</td><td>6</td><td>0</td><td>MW-02</td><td><span class="badge">OK</span></td></tr><tr><td>St. Clairsville</td><td>6</td><td>3</td><td>3</td><td>0</td><td>1</td><td>SC-11</td><td><span class="badge redb">Low</span></td></tr><tr><td>Odessa</td><td>8</td><td>2</td><td>6</td><td>4</td><td>0</td><td>OD-08</td><td><span class="badge">OK</span></td></tr></table></div></div><div class="tabs">${sections.Inventory.map(x=>`<button class="tab">${x}</button>`).join('')}</div>`}
function modulePage(){return `<div class="modulehead"><div><h2 style="margin:0 0 4px">${active.replace('_',' ')}</h2><div class="muted">All functions from the current ERP are preserved here, organized into a cleaner workspace.</div></div><button class="tab">+ New</button></div><div class="tabs">${sections[active].slice(0,6).map(x=>`<button class="tab">${x}</button>`).join('')}</div><div class="grid modulegrid">${sections[active].map((x,i)=>`<div class="card feature"><b>${x}</b><small>${['Open and manage records','Search, filter and export','Connected to inventory and accounting'][i%3]}</small></div>`).join('')}</div>`}
function render(){renderNav();main.innerHTML=active==='Dashboard'?dashboard():active==='Inventory'?inventory():modulePage()}
render();
</script>
</body>
</html>
