function openFeature(f){state.feature=f;state.page=1;render();history.replaceState(null,'',`#${encodeURIComponent(state.module)}/${encodeURIComponent(f)}`)}
function setLocation(v){state.location=v;document.getElementById('topLocation').value=v;render();toast('Location changed to '+v)}
function dashboard(){let p=samples;return `<div class="pagehead"><div><h1>Dashboard</h1><div class="sub">Executive overview across Sales, Purchasing, Inventory, Warehouse, Quality, Production and Accounting</div></div><div class="actions"><button class="btn" onclick="toast('Dashboard refreshed')">↻ Refresh</button><button class="btn primary" onclick="openModule('Sales')">Open Sales</button></div></div><div class="grid kpis">${[['Sales Today','$86,221.00'],['Open Sales Orders','82'],['Backorders','14'],['Orders Ready to Ship','18'],['Open Purchase Orders','53'],['Inventory Value','$2,587,310.45'],['Low Stock Items','24'],['Items Awaiting QC','12'],['Accounts Receivable','$1,041,640.50'],['Accounts Payable','$438,187.63']].map(x=>`<div class="kpi"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><small class="sub">Live approval preview</small></div>`).join('')}</div><div class="grid sectionrow"><div class="card panel"><h3>Stock Summary by Location</h3>${table(['Location','Available Qty','Committed Qty','On PO','QC Hold','Total Qty','Stock Value'],[['Houston','18,942','3,256','7,845','1,254','31,297','$1,256,410.25'],['Midland','12,578','2,146','4,230','852','19,806','$782,540.60'],['St. Clairsville','8,765','1,532','2,655','612','13,564','$336,280.30'],['Odessa','6,432','1,024','1,785','421','9,662','$212,079.30']])}</div><div class="card panel"><h3>Action Required</h3>${['7 Sales Orders waiting for stock allocation','3 Purchase Orders are past due','12 Items waiting for Quality Inspection','4 Orders are ready to ship','6 Customer invoices are past due','2 Supplier payments are due today'].map((x,i)=>`<div style="padding:10px 4px;border-bottom:1px solid #edf0f4">${x}<button class="btn" style="float:right;padding:4px 8px" onclick="openModule(['Sales','Purchasing','Quality','Warehouse','Accounting','Accounting'][${i}])">View</button></div>`).join('')}</div></div>`}
function modulePage(){let p=profile(),features=modules[state.module],idx=features.indexOf(state.feature);return `<div class="pagehead"><div><h1>${state.module}</h1><div class="sub">${state.feature} • ${state.location}</div></div><div class="actions"><button class="btn" onclick="prevFeature()">← Previous</button><button class="btn primary" onclick="nextFeature()">Next →</button><button class="btn success" onclick="newRecord()">+ New / Add</button></div></div><div class="worklayout"><div class="card modulemenu"><h3>${state.module} Pages</h3>${features.map(f=>`<button class="featurebtn ${f===state.feature?'active':''}" onclick="openFeature('${f.replaceAll("'","\\'")}')">${f}</button>`).join('')}</div><div><div class="grid modulekpis">${p.k.map((k,i)=>`<div class="card mkpi"><small>${k}</small><b>${p.v[i]}</b></div>`).join('')}</div><div class="card"><div class="toolbar">${toolbarFor(state.module)}<button class="btn primary" onclick="searchRecords()">🔎 Search</button><button class="btn" onclick="toast('Export generated for ${state.feature.replaceAll("'","")}')">Export</button></div><div class="tabs"><button class="tab active">${state.feature}</button><button class="tab" onclick="toast('Detailed view selected')">Details</button><button class="tab" onclick="toast('History view selected')">History</button></div><div id="tableArea">${pagedTable()}</div></div></div></div>`}
function toolbarFor(m){let common=`<div class="field"><label>From</label><input type="date" value="2026-08-01"></div><div class="field"><label>To</label><input type="date" value="2026-08-19"></div><div class="field"><label>Plant</label><select><option>${state.location}</option><option>Houston</option><option>Midland</option><option>St. Clairsville</option><option>Odessa</option></select></div>`;let extra={Sales:'Customer / SO / Item',Purchasing:'Supplier / PO / Item',Inventory:'Item Code / Description',Warehouse:'Transfer / Receipt / Item',Quality:'IIR / GRN / Item',Planning:'Plan / Item',Production:'Work Order / Item',Accounting:'Account / Document / Party',Reports:'Report Name','Master Data':'Code / Name',Settings:'Setting / Category'}[m]||'Search';return common+`<div class="field grow"><label>${extra}</label><input id="moduleSearch" placeholder="Search ${extra}"></div>`}
function filteredRows(){let q=(document.getElementById('moduleSearch')?.value||'').toLowerCase(),rows=profile().rows;if(q)rows=rows.filter(r=>r.join(' ').toLowerCase().includes(q));return rows}
function pagedTable(){let p=profile(),rows=filteredRows(),pages=Math.max(1,Math.ceil(rows.length/state.rowsPerPage));state.page=Math.min(state.page,pages);let start=(state.page-1)*state.rowsPerPage,subset=rows.slice(start,start+state.rowsPerPage);return `${table(p.cols,subset,true)}<div class="pagination"><span>Page ${state.page} of ${pages} • ${rows.length} records</span><div class="pager"><button class="btn" onclick="pagePrev()" ${state.page<=1?'disabled':''}>Previous</button><button class="btn primary" onclick="pageNext()" ${state.page>=pages?'disabled':''}>Next</button></div></div>`}
function table(cols,rows,editable=false){return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}${editable?'<th>Actions</th>':''}</tr></thead><tbody>${rows.map((r,ri)=>`<tr>${r.map((c,ci)=>`<td ${editable?'contenteditable="true" class="editable" onblur="cellSaved(this)"':''}>${esc(c)}</td>`).join('')}${editable?`<td><button class="btn" style="padding:4px 7px" onclick="editRow(${ri})">Edit</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function nextFeature(){let a=modules[state.module],i=a.indexOf(state.feature);state.feature=a[(i+1)%a.length];state.page=1;render();window.scrollTo(0,0)}function prevFeature(){let a=modules[state.module],i=a.indexOf(state.feature);state.feature=a[(i-1+a.length)%a.length];state.page=1;render();window.scrollTo(0,0)}
function pageNext(){let n=Math.ceil(filteredRows().length/state.rowsPerPage);if(state.page<n){state.page++;document.getElementById('tableArea').innerHTML=pagedTable();window.scrollTo({top:0,behavior:'smooth'})}}function pagePrev(){if(state.page>1){state.page--;document.getElementById('tableArea').innerHTML=pagedTable()}}
function searchRecords(){state.page=1;document.getElementById('tableArea').innerHTML=pagedTable();toast('Search applied to '+state.feature)}
function cellSaved(el){toast('Change saved in preview')}
function editRow(i){let r=profile().rows[i]||profile().rows[0],cols=profile().cols;document.getElementById('modalTitle').textContent='Edit '+state.feature;document.getElementById('modalBody').innerHTML=`<div class="formgrid">${cols.slice(0,Math.min(cols.length,8)).map((c,j)=>`<div class="field"><label>${c}</label><input value="${esc(r[j]||'')}"></div>`).join('')}<div class="field" style="grid-column:1/-1"><label>Notes</label><textarea rows="3">Editable approval preview record</textarea></div></div>`;document.getElementById('modalback').classList.add('show')}
function newRecord(){document.getElementById('modalTitle').textContent='New '+state.feature;document.getElementById('modalBody').innerHTML=`<div class="formgrid">${profile().cols.slice(0,8).map(c=>`<div class="field"><label>${c}</label><input placeholder="Enter ${c}"></div>`).join('')}</div>`;document.getElementById('modalback').classList.add('show')}
function closeModal(){document.getElementById('modalback').classList.remove('show')}function saveRecord(){closeModal();toast('Record saved in approval preview')}
function globalSearchKey(e){if(e.key==='Enter'){let q=e.target.value.toLowerCase();for(let m of Object.keys(modules)){let f=modules[m].find(x=>x.toLowerCase().includes(q));if(f){state.module=m;state.feature=f;nav();render();toast('Opened '+f);return}}toast('No matching page found')}}
function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1800)}
function render(){nav();document.getElementById('main').innerHTML=state.module==='Dashboard'?dashboard():modulePage();document.getElementById('topLocation').value=state.location}
window.addEventListener('hashchange',()=>{let h=location.hash.slice(1).split('/').map(decodeURIComponent);if(modules[h[0]]){state.module=h[0];state.feature=modules[h[0]].includes(h[1])?h[1]:modules[h[0]][0];render()}});if(location.hash){let h=location.hash.slice(1).split('/').map(decodeURIComponent);if(modules[h[0]]){state.module=h[0];state.feature=modules[h[0]].includes(h[1])?h[1]:modules[h[0]][0]}}render();
</script></body></html>
