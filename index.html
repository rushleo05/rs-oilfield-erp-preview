r><tr><td>ASP-300</td><td>Adapter Spool 3&quot; 3000#</td><td>Houston</td><td>5</td><td>20</td></tr><tr><td>WN-150-6</td><td>Weld Neck 6&quot; 150#</td><td class="locM">Midland</td><td>3</td><td>15</td></tr><tr><td>STUD-TEE-4</td><td>Studded Tee 4&quot; 3000#</td><td>Houston</td><td>2</td><td>10</td></tr><tr><td>BLRF-8-300</td><td>Blind Flange 8&quot; 300#</td><td class="locS">St. Clairsville</td><td>1</td><td>8</td></tr><tr><td>GASKET-RJ-8</td><td>Ring Type Joint Gasket 8&quot;</td><td class="locO">Odessa</td><td>4</td><td>12</td></tr></table></div></div></div><div class="grid threecol section"><div class="card panel"><div class="panelhead"><h3>Action Required</h3></div>${[['🛒','7 Sales Orders waiting for stock allocation','7'],['📋','3 Purchase Orders are past due','3'],['✓','12 Items waiting for Quality Inspection','12'],['🚚','4 Orders are ready to ship','4'],['👥','6 Customer Invoices are past due','6'],['$','2 Supplier Payments are due today','2']].map(x=>`<div class="actionline"><span>${x[0]}</span><span>${x[1]}</span><span class="abubble">${x[2]}</span><span class="alink">View</span></div>`).join('')}</div><div class="card panel"><div class="panelhead"><h3>Sales vs Purchase <span style="font-weight:400">(This Month)</span></h3></div><div class="legend"><b style="background:#4daf3a"></b>Sales (USD)<b style="background:#1c77d8"></b>Purchase (USD)</div><div class="bars">${[[138,100,'Week 1'],[118,83,'Week 2'],[142,105,'Week 3'],[130,95,'Week 4'],[70,52,'Week 5']].map(x=>`<div class="bargrp"><div class="bar salesbar" style="height:${x[0]}px"></div><div class="bar buybar" style="height:${x[1]}px"></div><span>${x[2]}</span></div>`).join('')}</div></div><div class="card panel"><div class="panelhead"><h3>Recent Transactions</h3><button class="viewall">View All</button></div>${[['08/19/2026','Sales Order SO5020260972','$4,500.00','greenamt'],['08/19/2026','Purchase Order PO5020261045','$18,450.00','redamt'],['08/18/2026','Goods Receipt GRN5020261053','$12,870.00','greenamt'],['08/18/2026','Sales Invoice INV2600415','$7,210.00','greenamt'],['08/18/2026','Customer Receipt RCPT2600346','$7,210.00','greenamt']].map(x=>`<div class="recentrow"><span>${x[0]}</span><span>${x[1]}</span><span class="amt ${x[3]}">${x[2]}</span></div>`).join('')}</div></div><div class="card bottomstats">${[['Total Items','4,862'],['Active Customers','1,256'],['Active Suppliers','842'],['Employees','36'],['Open Work Orders','22'],['In Production','15']].map(x=>`<div class="stat">${x[0]}<b class="editable" contenteditable="true">${x[1]}</b></div>`).join('')}</div>`}
function rowsFor(m){let b=baseRows[m]||baseRows.Reports,out=[];for(let i=0;i<15;i++){let r=[...b[i%b.length]];r[0]=i<2?r[0]:r[0]+'-'+String(i+1).padStart(2,'0');out.push(r)}return out}
function modulePage(){let cfg=configs[state.module]||configs.Reports,rows=rowsFor(state.module),totalPages=Math.ceil(rows.length/state.rowsPerPage);state.page=Math.min(state.page,totalPages);let start=(state.page-1)*state.rowsPerPage,shown=rows.slice(start,start+state.rowsPerPage);return `<div class="pagehead"><div><h1>${state.module}</h1><div class="sub">${state.feature} • ${state.location}</div></div><div class="actions"><button class="btn" onclick="nextFeature(-1)">← Previous</button><button class="btn" onclick="nextFeature(1)">Next →</button><button class="btn primary" onclick="openEdit(-1)">+ New</button></div></div><div class="worklayout"><div class="card modulemenu"><h3>${state.module} Menu</h3>${modules[state.module].map(f=>`<button class="featurebtn ${f===state.feature?'active':''}" onclick="chooseFeature('${f.replaceAll("'","\\'")}')">${f}</button>`).join('')}</div><div class="workspace"><div class="grid modulekpis">${cfg.k.map((k,i)=>`<div class="card mkpi"><small>${k}</small><b class="editable" contenteditable="true">${cfg.v[i]}</b></div>`).join('')}</div><div class="card"><div class="toolbar"><div class="field grow"><label>Search ${state.feature}</label><input id="searchBox" placeholder="Search document, customer, supplier, item..." oninput="filterRows()"></div><div class="field"><label>Location</label><select onchange="setLocation(this.value)"><option>${state.location}</option><option>All Locations</option><option>Houston</option><option>Midland</option><option>St. Clairsville</option><option>Odessa</option></select></div><button class="btn" onclick="exportCSV()">Export CSV</button><button class="btn" onclick="window.print()">Print</button></div><div class="tabs"><button class="tab ${state.view==='list'?'active':''}" onclick="state.view='list';render()">List</button><button class="tab ${state.view==='details'?'active':''}" onclick="state.view='details';render()">Details</button><button class="tab ${state.view==='history'?'active':''}" onclick="state.view='history';render()">History</button></div><div id="viewArea">${renderView(shown,cfg,rows)}</div></div></div></div>`}
function renderView(shown,cfg,all){if(state.view==='details')return detailsView(all);if(state.view==='history')return historyView();return `<div class="tablewrap"><table id="dataTable"><thead><tr>${cfg.cols.map(c=>`<th>${c}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${shown.map((r,idx)=>`<tr>${r.map(c=>`<td class="editable" contenteditable="true">${c}</td>`).join('')}<td><span class="alink" onclick="state.selected=${(state.page-1)*state.rowsPerPage+idx};state.view='details';render()">Details</span> &nbsp; <span class="alink" onclick="state.selected=${(state.page-1)*state.rowsPerPage+idx};state.view='history';render()">History</span> &nbsp; <span class="alink" onclick="openEdit(${(state.page-1)*state.rowsPerPage+idx})">Edit</span></td></tr>`).join('')}</tbody></table></div><div class="pagination"><span>Showing ${(state.page-1)*state.rowsPerPage+1}-${Math.min(state.page*state.rowsPerPage,all.length)} of ${all.length}</span><div><button class="btn" onclick="goPage(-1)" ${state.page===1?'disabled':''}>← Previous</button> <b>Page ${state.page} of ${Math.ceil(all.length/state.rowsPerPage)}</b> <button class="btn" onclick="goPage(1)" ${state.page>=Math.ceil(all.length/state.rowsPerPage)?'disabled':''}>Next →</button></div></div>`}
function detailsView(all){let r=all[state.selected]||all[0],cfg=configs[state.module]||configs.Reports;return `<div class="detailgrid">${cfg.cols.map((c,i)=>`<div class="detailbox"><small>${c}</small><div class="editable" contenteditable="true">${r[i]||'—'}</div></div>`).join('')}</div><div style="padding:0 12px 12px"><button class="btn primary" onclick="openEdit(${state.selected})">Edit Record</button> <button class="btn" onclick="state.view='history';render()">View History</button> <button class="btn" onclick="state.view='list';render()">Back to List</button></div>`}
function historyView(){let id=(rowsFor(state.module)[state.selected]||['Record'])[0];return `<div class="history"><div class="historyitem"><b>${id}</b> created in ${state.module}.<br><span class="sub">08/19/2026 09:18 AM • Admin</span></div><div class="historyitem"><b>Status updated</b> for ${state.feature}.<br><span class="sub">08/19/2026 10:04 AM • Operations User</span></div><div class="historyitem"><b>Quantity / value reviewed</b> and saved.<br><span class="sub">08/19/2026 11:26 AM • Admin</span></div></div><div style="padding:0 12px 12px"><button class="btn" onclick="state.view='details';render()">Details</button> <button class="btn" onclick="state.view='list';render()">Back to List</button></div>`}
function goPage(d){let max=Math.ceil(rowsFor(state.module).length/state.rowsPerPage);state.page=Math.max(1,Math.min(max,state.page+d));render()}
function openEdit(i){let rows=rowsFor(state.module),cfg=configs[state.module]||configs.Reports,r=i>=0?rows[i]:new Array(cfg.cols.length).fill('');state.selected=Math.max(i,0);modalTitle.textContent=(i>=0?'Edit ':'New ')+state.feature;modalBody.innerHTML=`<div class="formgrid">${cfg.cols.map((c,j)=>`<div class="field"><label>${c}</label><input value="${String(r[j]||'').replaceAll('"','&quot;')}"></div>`).join('')}</div>`;modalback.classList.add('show')}
function closeModal(){modalback.classList.remove('show')}function saveRecord(){closeModal();toastMsg('Changes saved in this preview.')}function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
function filterRows(){let q=(searchBox?.value||'').toLowerCase();document.querySelectorAll('#dataTable tbody tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none')}
function exportCSV(){let cfg=configs[state.module]||configs.Reports,rows=rowsFor(state.module),csv=[cfg.cols.join(','),...rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=state.module.replaceAll(' ','_')+'.csv';a.click()}
function render(){renderNav();topLocation.value=state.location;main.innerHTML=state.module==='Dashboard'?dashboard():modulePage()}render();
</script></body></html>
