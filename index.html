<div class="grid sectionrow"><div class="card panel"><h3>Stock Summary by Location</h3><div class="tablewrap"><table><thead><tr><th>Location</th><th>Available Qty</th><th>Committed Qty</th><th>On PO</th><th>QC Hold</th><th>Total Qty</th><th>Stock Value</th></tr></thead><tbody><tr><td class="alink" onclick="setLocation('Houston')">Houston</td><td>18,942</td><td>3,256</td><td>7,845</td><td>1,254</td><td>31,297</td><td>$1,256,410.25</td></tr><tr><td class="green" onclick="setLocation('Midland')">Midland</td><td>12,578</td><td>2,146</td><td>4,230</td><td>852</td><td>19,806</td><td>$782,540.60</td></tr><tr><td class="purple">St. Clairsville</td><td>8,765</td><td>1,532</td><td>2,655</td><td>612</td><td>13,564</td><td>$336,280.30</td></tr><tr><td class="orange">Odessa</td><td>6,432</td><td>1,024</td><td>1,785</td><td>421</td><td>9,662</td><td>$212,079.30</td></tr><tr><td><b>Total</b></td><td><b>46,717</b></td><td><b>7,958</b></td><td><b>16,515</b></td><td><b>3,139</b></td><td><b>74,329</b></td><td><b>$2,587,310.45</b></td></tr></tbody></table></div></div><div class="card panel"><h3>Top 5 Low Stock Items <span class="alink" style="float:right" onclick="state.section='Inventory';state.page='Min-Max Levels';render()">View All</span></h3><div class="tablewrap"><table><thead><tr><th>Item Code</th><th>Description</th><th>Location</th><th>Available</th><th>Min Level</th></tr></thead><tbody><tr><td>ASP-300</td><td>Adapter Spool 3” 3000#</td><td>Houston</td><td>5</td><td>20</td></tr><tr><td>WN-150-6</td><td>Weld Neck 6” 150#</td><td class="green">Midland</td><td>3</td><td>15</td></tr><tr><td>STUD-TEE-4</td><td>Studded Tee 4” 3000#</td><td>Houston</td><td>2</td><td>10</td></tr><tr><td>BLRF-8-300</td><td>Blind Flange 8” 300#</td><td class="purple">St. Clairsville</td><td>1</td><td>8</td></tr><tr><td>GASKET-RJ-8</td><td>Ring Type Joint Gasket 8”</td><td class="orange">Odessa</td><td>4</td><td>12</td></tr></tbody></table></div></div></div>
<div class="grid dashbottom"><div class="card panel"><h3>Action Required</h3>${action('🛒','7 Sales Orders waiting for stock allocation','7','Sales','Stock Allocation')}${action('🧾','3 Purchase Orders are past due','3','Purchasing','Open Purchase Orders')}${action('✓','12 Items waiting for Quality Inspection','12','Quality','Pending Inspection')}${action('🚚','4 Orders are ready to ship','4','Warehouse','Dispatch / Delivery')}${action('👥','6 Customer Invoices are past due','6','Accounting','Receivable Aging Details')}${action('$','2 Supplier Payments are due today','2','Accounting','Payment To Supplier')}</div><div class="card panel"><h3>Sales vs Purchase (This Month)</h3><div class="bars">${[1,2,3,4,5].map((w,i)=>`<div><div class="barpair"><div class="bar salesbar" style="height:${[120,100,128,112,62][i]}px"></div><div class="bar buybar" style="height:${[88,70,91,82,45][i]}px"></div></div><div class="week">Week ${w}</div></div>`).join('')}</div></div><div class="card panel"><h3>Recent Transactions <span class="alink" style="float:right">View All</span></h3><div class="tablewrap"><table><tbody><tr><td>08/19/2026</td><td>Sales Order SO5020260972</td><td class="green">$4,500.00</td></tr><tr><td>08/19/2026</td><td>Purchase Order PO5020261045</td><td class="orange">$18,450.00</td></tr><tr><td>08/18/2026</td><td>Goods Receipt GRN5020261053</td><td class="green">$12,870.00</td></tr><tr><td>08/18/2026</td><td>Sales Invoice INV2600415</td><td class="green">$7,210.00</td></tr><tr><td>08/18/2026</td><td>Customer Receipt RCPT2600346</td><td class="green">$7,210.00</td></tr></tbody></table></div></div></div>
<div class="card grid footstats">${foot('Total Items','4,862')}${foot('Active Customers','1,256')}${foot('Active Suppliers','842')}${foot('Employees','36')}${foot('Open Work Orders','22')}${foot('In Production','15')}</div>`}
function kpi(i,l,v,s,c){return `<div class="kpi"><div class="circle ${c}">${i}</div><div class="txt"><div class="label">${l}</div><div class="value">${v}</div><small>${s}</small></div></div>`}function foot(l,v){return `<div class="footstat"><span class="sub">${l}</span><b>${v}</b></div>`}function action(i,t,n,s,p){return `<div class="actionline"><span>${i} ${t}</span><span><span class="badge red">${n}</span> &nbsp;<span class="alink" onclick="state.section='${s}';state.page='${p.replace(/'/g,"\\'")}';render()">View</span></span></div>`}
function workspace(){const sec=state.section, page=state.page;return `<div class="pagehead"><div><h1>${sec.replace('_',' ')}</h1><div class="sub">${page} • ${state.location}</div></div><div class="actions"><button class="btn" onclick="exportCSV('${page.replace(/'/g,"\\'")}')">⇩ Export</button><button class="btn" onclick="window.print()">🖨 Print</button><button class="btn primary" onclick="openModal()">+ New / Add</button></div></div><div class="worklayout"><div class="card modulemenu"><h3>${sec.replace('_',' ')} Pages</h3>${modules[sec].map(p=>`<button class="featurebtn ${p===page?'active':''}" onclick="openPage('${p.replace(/'/g,"\\'")}')">${p}</button>`).join('')}</div><div class="workspace"><div class="grid modulekpis">${moduleKpi(sec,'Records',getRows().length+'')}${moduleKpi(sec,'Open / Pending',pendingCount()+'')}${moduleKpi(sec,'Location',state.location==='All Locations'?'4':state.location)}${moduleKpi(sec,'Last Updated','Today')}</div><div class="card"><div class="toolbar">${filterFields(sec)}<button class="btn primary" onclick="applyFilter()">Search</button><button class="btn" onclick="clearFilter()">Clear</button></div><div class="tabs"><button class="tab ${state.status==='All'?'active':''}" onclick="setStatus('All')">All</button><button class="tab ${state.status==='New'?'active':''}" onclick="setStatus('New')">New</button><button class="tab ${state.status==='Pending'?'active':''}" onclick="setStatus('Pending')">Pending</button><button class="tab ${state.status==='Completed'?'active':''}" onclick="setStatus('Completed')">Completed</button></div><div id="recordTable">${recordTable(sec,page)}</div></div></div></div>`}
function moduleKpi(sec,l,v){return `<div class="card mkpi"><small>${l}</small><b>${v}</b></div>`}function pendingCount(){return getRows().filter(r=>/pending|new|hold|open|ready|reorder|below/i.test(r[3])).length}
function filterFields(sec){return `<div class="field"><label>From Date</label><input type="date" value="2026-08-01"></div><div class="field"><label>To Date</label><input type="date" value="2026-08-19"></div><div class="field"><label>Location</label><select onchange="setLocation(this.value)"><option ${state.location==='All Locations'?'selected':''}>All Locations</option><option ${state.location==='Houston'?'selected':''}>Houston</option><option ${state.location==='Midland'?'selected':''}>Midland</option><option ${state.location==='St. Clairsville'?'selected':''}>St. Clairsville</option><option ${state.location==='Odessa'?'selected':''}>Odessa</option></select></div><div class="field grow"><label>Search ${sec==='Inventory'?'Item Code / Description':'Name / Number / Description'}</label><input id="moduleSearch" value="${state.search}" placeholder="Type to filter records..."></div>`}
function getRows(){return records[state.section]||records.Reports}
function recordTable(sec,page){let rows=[...getRows()];const q=state.search.toLowerCase();if(q)rows=rows.filter(r=>r.join(' ').toLowerCase().includes(q));if(state.status!=='All')rows=rows.filter(r=>r[3].toLowerCase().includes(state.status.toLowerCase()));const headers=headerFor(sec);return `<div class="tablewrap" style="border-left:0;border-right:0;border-radius:0"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${rows.length?rows.map((r,i)=>`<tr>${r.map((v,j)=>`<td>${j===0?`<span class="alink" onclick="openDetails(${i})">${v}</span>`:j===3?statusBadge(v):v}</td>`).join('')}<td><span class="alink" onclick="openDetails(${i})">View</span> &nbsp; <span class="alink" onclick="openModal(${i})">Edit</span></td></tr>`).join(''):`<tr><td colspan="${headers.length+1}"><div class="empty">No records match the selected filters.</div></td></tr>`}</tbody></table></div><div class="pagination"><span>Total Records: ${rows.length}</span><span><button class="btn" onclick="showToast('Previous page')">Previous</button> <button class="btn" onclick="showToast('Next page')">Next</button></span></div>`}
function headerFor(sec){return {Sales:['SO / Doc No','Customer','Date','Status','Amount'],Purchasing:['PO / Doc No','Supplier / Vendor','Date','Status','Amount'],Inventory:['Item Code','Description','Location','Stock Status','Qty'],Warehouse:['Document No','From / To / Party','Item Code','Status','Qty'],Quality:['Inspection No','Supplier','Item Code','Status','Qty'],Planning:['Plan No','Item Code','Location','Status','Qty'],Production:['WO / Prod No','Type','Item Code','Status','Qty'],Accounting:['Accounting Doc No','Document Type','Party / Account','Status','Amount'],Reports:['Report ID','Category','Report Name','Status','Format'],Master_Data:['Code','Master Type','Description','Status','Group / Location'],Settings:['Code','Setting Type','Description','Status','Value']}[sec]||['No','Type','Description','Status','Value']}
function statusBadge(v){const c=/completed|accept|posted|active|available|ready/i.test(v)?'':/hold|pending|partial|open|reorder|below/i.test(v)?'warn':/reject|cancel/i.test(v)?'red':'blue';return `<span class="badge ${c}"><span class="statusdot ${/completed|accept|posted|active|available|ready/i.test(v)?'cgreen':/reject|cancel/i.test(v)?'cred':'corange'}"></span>${v}</span>`}
function applyFilter(){state.search=(document.getElementById('moduleSearch')?.value||'').trim();document.getElementById('recordTable').innerHTML=recordTable(state.section,state.page);showToast('Filters applied')}
function clearFilter(){state.search='';state.status='All';renderMain()}
function setStatus(s){state.status=s;renderMain()}
function openDetails(i){const r=getRows()[i]||[];document.getElementById('modalTitle').textContent=state.page+' Details';document.getElementById('modalBody').innerHTML=`<div class="formgrid">${r.map((v,j)=>`<div class="field"><label>${headerFor(state.section)[j]||'Field'}</label><input value="${String(v).replace(/"/g,'&quot;')}" readonly></div>`).join('')}<div class="field"><label>Location</label><input value="${state.location}" readonly></div><div class="field"><label>Audit Status</label><input value="System tracked" readonly></div><div class="field" style="grid-column:1/-1"><label>Notes / Remarks</label><textarea rows="4">Approval preview record. Full history, attachments, audit trail and transaction links will appear here.</textarea></div></div>`;modalback.classList.add('show')}
function openModal(i){const edit=Number.isInteger(i), r=edit?(getRows()[i]||[]):[];document.getElementById('modalTitle').textContent=(edit?'Edit ':'New ')+state.page;const h=headerFor(state.section);document.getElementById('modalBody').innerHTML=`<div class="formgrid">${h.map((x,j)=>`<div class="field"><label>${x}</label>${j===3?`<select id="f${j}"><option>New</option><option>Pending</option><option>Ready</option><option>Completed</option><option>Hold</option></select>`:`<input id="f${j}" value="${(r[j]||'').toString().replace(/"/g,'&quot;')}" placeholder="Enter ${x}">`}</div>`).join('')}<div class="field"><label>Location</label><select id="floc"><option>Houston</option><option>Midland</option><option>St. Clairsville</option><option>Odessa</option></select></div><div class="field"><label>Assigned To</label><input value="Rushi Patel"></div><div class="field" style="grid-column:1/-1"><label>Notes / Remarks</label><textarea id="fnotes" rows="4" placeholder="Enter notes, terms, inspection comments, shipping instructions, etc."></textarea></div></div>`;modalback.dataset.edit=edit?i:'';modalback.classList.add('show')}
function closeModal(){modalback.classList.remove('show');modalback.dataset.edit=''}
function saveRecord(){const h=headerFor(state.section);const vals=h.map((_,j)=>document.getElementById('f'+j)?.value||'');if(vals.every(x=>!x)){showToast('Enter at least one field');return}const idx=modalback.dataset.edit;if(idx!=='')records[state.section][+idx]=vals;else records[state.section].unshift(vals);try{localStorage.setItem('rs-erp-demo-'+state.section,JSON.stringify(records[state.section]))}catch(e){}closeModal();renderMain();showToast(idx!==''?'Record updated':'Record saved')}
function exportCSV(name){const h=headerFor(state.section==='Dashboard'?'Reports':state.section);const rows=state.section==='Dashboard'?records.Reports:getRows();const csv=[h,...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const b=new Blob([csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(name||'rs-oilfield-erp').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.csv';a.click();URL.revokeObjectURL(a.href);showToast('CSV export created')}
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>toast.classList.remove('show'),2200)}
for(const s of Object.keys(records)){try{const saved=localStorage.getItem('rs-erp-demo-'+s);if(saved)records[s]=JSON.parse(saved)}catch(e){}}
render();
</script>
</body>
</html>
